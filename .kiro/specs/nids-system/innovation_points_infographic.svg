<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa" stroke="none"/>
  
  <!-- Title -->
  <rect x="50" y="20" width="1100" height="80" fill="#2c3e50" stroke="none" rx="10"/>
  <text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="white">网络入侵检测系统创新点</text>
  <text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="18" fill="#ecf0f1">Network Intrusion Detection System Innovation Points</text>
  <text x="600" y="85" text-anchor="middle" font-family="Arial" font-size="14" fill="#bdc3c7">基于混合机器学习/深度学习的智能检测架构</text>
  
  <!-- Innovation 1: Hybrid ML/DL Architecture -->
  <g id="innovation1">
    <rect x="50" y="120" width="540" height="180" fill="white" stroke="#3498db" stroke-width="3" rx="15"/>
    <rect x="50" y="120" width="540" height="40" fill="#3498db" stroke="none" rx="15"/>
    <text x="320" y="145" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">创新点一：混合机器学习/深度学习融合架构</text>
    
    <!-- ML Models -->
    <rect x="70" y="180" width="100" height="60" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="120" y="200" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">LightGBM</text>
    <text x="120" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">高效梯度提升</text>
    <text x="120" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">传统机器学习</text>
    
    <rect x="180" y="180" width="100" height="60" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="230" y="200" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">XGBoost</text>
    <text x="230" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">极端梯度提升</text>
    <text x="230" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">集成学习</text>
    
    <!-- DL Models -->
    <rect x="320" y="180" width="100" height="60" fill="#d5e8f7" stroke="#2980b9" stroke-width="2" rx="8"/>
    <text x="370" y="200" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">1D-CNN</text>
    <text x="370" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">一维卷积网络</text>
    <text x="370" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">深度学习</text>
    
    <rect x="430" y="180" width="100" height="60" fill="#d5e8f7" stroke="#2980b9" stroke-width="2" rx="8"/>
    <text x="480" y="200" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">GRU</text>
    <text x="480" y="215" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">门控循环单元</text>
    <text x="480" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f8c8d">时序建模</text>
    
    <!-- Smart Selection -->
    <path d="M 280 160 L 320 160 L 320 180" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead-red)"/>
    <text x="300" y="155" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#e74c3c">智能选择</text>
    
    <text x="70" y="270" font-family="Arial" font-size="12" fill="#2c3e50">• 结合ML高效率与DL强特征学习能力</text>
    <text x="70" y="285" font-family="Arial" font-size="12" fill="#2c3e50">• 动态选择最优模型进行预测</text>
    <text x="70" y="300" font-family="Arial" font-size="12" fill="#2c3e50">• 提升检测准确率与处理速度</text>
  </g>
  
  <!-- Innovation 2: Redis Async Processing -->
  <g id="innovation2">
    <rect x="610" y="120" width="540" height="180" fill="white" stroke="#e67e22" stroke-width="3" rx="15"/>
    <rect x="610" y="120" width="540" height="40" fill="#e67e22" stroke="none" rx="15"/>
    <text x="880" y="145" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">创新点二：Redis队列驱动异步批处理机制</text>
    
    <!-- Redis Queue -->
    <rect x="630" y="180" width="120" height="80" fill="#fef5e7" stroke="#e67e22" stroke-width="2" rx="10"/>
    <text x="690" y="200" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#d35400">Redis</text>
    <text x="690" y="215" text-anchor="middle" font-family="Arial" font-size="12" fill="#e67e22">Traffic Queue</text>
    <rect x="650" y="230" width="80" height="20" fill="#f39c12" stroke="none" rx="5"/>
    <text x="690" y="243" text-anchor="middle" font-family="Arial" font-size="10" fill="white">LPUSH + BRPOP</text>
    
    <!-- Producer -->
    <rect x="770" y="180" width="80" height="60" fill="#fdeaa7" stroke="#f39c12" stroke-width="2" rx="8"/>
    <text x="810" y="195" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2c3e50">生产者</text>
    <text x="810" y="210" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">流量捕获</text>
    <text x="810" y="225" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">实时写入</text>
    
    <!-- Consumer -->
    <rect x="870" y="180" width="80" height="60" fill="#fdeaa7" stroke="#f39c12" stroke-width="2" rx="8"/>
    <text x="910" y="195" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2c3e50">消费者</text>
    <text x="910" y="210" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">批处理</text>
    <text x="910" y="225" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">异步读取</text>
    
    <!-- Flow Arrows -->
    <path d="M 750 210 L 770 210" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#arrowhead-orange)"/>
    <path d="M 850 210 L 870 210" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#arrowhead-orange)"/>
    
    <text x="630" y="270" font-family="Arial" font-size="12" fill="#2c3e50">• Redis中间件实现异步缓存</text>
    <text x="630" y="285" font-family="Arial" font-size="12" fill="#2c3e50">• 批量处理避免实时压力</text>
    <text x="630" y="300" font-family="Arial" font-size="12" fill="#2c3e50">• 提高系统吞吐量与稳定性</text>
  </g>
  
  <!-- Innovation 3: Multi-dataset Feature Fusion -->
  <g id="innovation3">
    <rect x="50" y="320" width="540" height="180" fill="white" stroke="#27ae60" stroke-width="3" rx="15"/>
    <rect x="50" y="320" width="540" height="40" fill="#27ae60" stroke="none" rx="15"/>
    <text x="320" y="345" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">创新点三：多数据集特征融合技术</text>
    
    <!-- NSL-KDD -->
    <rect x="70" y="380" width="120" height="80" fill="#eafaf1" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="130" y="400" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#27ae60">NSL-KDD</text>
    <text x="130" y="415" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50">41维特征</text>
    <rect x="90" y="430" width="80" height="20" fill="#2ecc71" stroke="none" rx="5"/>
    <text x="130" y="443" text-anchor="middle" font-family="Arial" font-size="9" fill="white">传统网络特征</text>
    
    <!-- CIC-IDS2017 -->
    <rect x="210" y="380" width="120" height="80" fill="#eafaf1" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="270" y="400" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#27ae60">CIC-IDS2017</text>
    <text x="270" y="415" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50">78维特征</text>
    <rect x="230" y="430" width="80" height="20" fill="#2ecc71" stroke="none" rx="5"/>
    <text x="270" y="443" text-anchor="middle" font-family="Arial" font-size="9" fill="white">现代网络特征</text>
    
    <!-- Feature Fusion -->
    <rect x="360" y="390" width="120" height="60" fill="#d5f5e3" stroke="#16a085" stroke-width="2" rx="10"/>
    <text x="420" y="410" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#16a085">特征融合</text>
    <text x="420" y="425" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50">Feature Fusion</text>
    <text x="420" y="440" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">119维综合特征</text>
    
    <!-- Fusion Arrows -->
    <path d="M 190 410 L 350 410" stroke="#27ae60" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
    <path d="M 330 410 L 350 410" stroke="#27ae60" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
    
    <text x="70" y="470" font-family="Arial" font-size="12" fill="#2c3e50">• 支持两套特征体系并行工作</text>
    <text x="70" y="485" font-family="Arial" font-size="12" fill="#2c3e50">• NSL-KDD与CIC-IDS2017特征互补</text>
    <text x="70" y="500" font-family="Arial" font-size="12" fill="#2c3e50">• 提升模型泛化能力与覆盖率</text>
  </g>
  
  <!-- Innovation 4: Real-time SHAP Analysis -->
  <g id="innovation4">
    <rect x="610" y="320" width="540" height="180" fill="white" stroke="#8e44ad" stroke-width="3" rx="15"/>
    <rect x="610" y="320" width="540" height="40" fill="#8e44ad" stroke="none" rx="15"/>
    <text x="880" y="345" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">创新点四：实时SHAP可解释性分析</text>
    
    <!-- Model Prediction -->
    <rect x="630" y="380" width="100" height="60" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2" rx="8"/>
    <text x="680" y="395" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#8e44ad">模型预测</text>
    <text x="680" y="410" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">Detection</text>
    <text x="680" y="425" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">Result</text>
    
    <!-- SHAP Engine -->
    <rect x="750" y="380" width="120" height="80" fill="#e8daef" stroke="#9b59b6" stroke-width="2" rx="10"/>
    <text x="810" y="400" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#8e44ad">SHAP引擎</text>
    <text x="810" y="415" text-anchor="middle" font-family="Arial" font-size="10" fill="#9b59b6">SHAP Analyzer</text>
    <rect x="770" y="430" width="80" height="20" fill="#9b59b6" stroke="none" rx="5"/>
    <text x="810" y="443" text-anchor="middle" font-family="Arial" font-size="9" fill="white">实时计算</text>
    
    <!-- Explanation Output -->
    <rect x="890" y="380" width="100" height="60" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2" rx="8"/>
    <text x="940" y="395" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#8e44ad">解释输出</text>
    <text x="940" y="410" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">Feature</text>
    <text x="940" y="425" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">Importance</text>
    
    <!-- Flow Arrows -->
    <path d="M 730 410 L 750 410" stroke="#8e44ad" stroke-width="2" fill="none" marker-end="url(#arrowhead-purple)"/>
    <path d="M 870 410 L 890 410" stroke="#8e44ad" stroke-width="2" fill="none" marker-end="url(#arrowhead-purple)"/>
    
    <text x="630" y="470" font-family="Arial" font-size="12" fill="#2c3e50">• 集成SHAP算法实时解释预测结果</text>
    <text x="630" y="485" font-family="Arial" font-size="12" fill="#2c3e50">• 提供攻击检测的可信度分析</text>
    <text x="630" y="500" font-family="Arial" font-size="12" fill="#2c3e50">• 增强系统可信度与可维护性</text>
  </g>
  
  <!-- Bottom Summary -->
  <rect x="50" y="520" width="1100" height="120" fill="#34495e" stroke="none" rx="15"/>
  <text x="600" y="550" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">系统综合优势</text>
  <text x="600" y="575" text-anchor="middle" font-family="Arial" font-size="14" fill="#ecf0f1">高准确率 + 高吞吐量 + 强泛化能力 + 可解释性</text>
  <text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="12" fill="#bdc3c7">High Accuracy + High Throughput + Strong Generalization + Explainability</text>
  <text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="11" fill="#95a5a6">构建了一个在学术研究和实际应用中都具有先进性的智能网络入侵检测系统</text>
  
  <!-- Define arrow markers -->
  <defs>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/>
    </marker>
  </defs>
</svg>