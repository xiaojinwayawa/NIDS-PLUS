<svg width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="640" height="320" fill="#ffffff"/>
  
  <!-- 前端层 -->
  <rect x="20" y="20" width="220" height="80" rx="6" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="130" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">前端层</text>
  <!-- 前端模块 -->
  <rect x="30" y="65" width="45" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="52.5" y="80" text-anchor="middle" font-size="10" fill="#000000">仪表盘</text>
  <rect x="82" y="65" width="45" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="104.5" y="80" text-anchor="middle" font-size="10" fill="#000000">告警</text>
  <rect x="134" y="65" width="45" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="156.5" y="80" text-anchor="middle" font-size="10" fill="#000000">模型</text>
  <rect x="186" y="65" width="45" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="208.5" y="80" text-anchor="middle" font-size="10" fill="#000000">日志</text>

  <!-- 箭头 1 -->
  <path d="M 130 100 L 130 120" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="135" y="114" text-anchor="start" font-size="10" fill="#000000">HTTP/WebSocket</text>

  <!-- API服务层 -->
  <rect x="20" y="130" width="220" height="80" rx="6" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="130" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">API服务层</text>
  <!-- API模块 -->
  <rect x="35" y="175" width="55" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="62.5" y="190" text-anchor="middle" font-size="10" fill="#000000">REST</text>
  <rect x="102" y="175" width="55" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="129.5" y="190" text-anchor="middle" font-size="10" fill="#000000">WebSocket</text>
  <rect x="169" y="175" width="55" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="196.5" y="190" text-anchor="middle" font-size="10" fill="#000000">JWT</text>

  <!-- 箭头 2 -->
  <path d="M 130 210 L 130 230" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 检测引擎层 -->
  <rect x="20" y="240" width="220" height="75" rx="6" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="130" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">检测引擎层</text>
  <!-- 引擎模块 -->
  <rect x="30" y="280" width="45" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="52.5" y="295" text-anchor="middle" font-size="10" fill="#000000">数据捕获</text>
  <rect x="82" y="280" width="45" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="104.5" y="295" text-anchor="middle" font-size="10" fill="#000000">特征提取</text>
  <rect x="134" y="280" width="45" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="156.5" y="295" text-anchor="middle" font-size="10" fill="#000000">AI推理</text>
  <rect x="186" y="280" width="45" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="208.5" y="295" text-anchor="middle" font-size="10" fill="#000000">告警推送</text>

  <!-- 数据层 -->
  <rect x="280" y="130" width="160" height="80" rx="6" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="360" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">数据层</text>
  <rect x="295" y="175" width="60" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="325" y="190" text-anchor="middle" font-size="10" fill="#000000">MySQL</text>
  <rect x="365" y="175" width="60" height="22" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="395" y="190" text-anchor="middle" font-size="10" fill="#000000">Redis</text>

  <!-- 连接线 -->
  <path d="M 240 170 L 280 170" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 240 275 L 360 210" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- 标记定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
    </marker>
  </defs>
</svg>