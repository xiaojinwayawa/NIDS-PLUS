<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="white" stroke="none"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#000000">网络入侵检测系统数据流图</text>
  
  <!-- Traffic Capture Module -->
  <rect x="50" y="80" width="160" height="60" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="130" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">流量捕获模块</text>
  <text x="130" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">Traffic Capture</text>
  
  <!-- Redis Traffic Queue -->
  <rect x="300" y="80" width="160" height="60" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="380" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">Redis流量队列</text>
  <text x="380" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">Redis Traffic Queue</text>
  
  <!-- Feature Extractor -->
  <rect x="550" y="80" width="160" height="60" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="630" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">特征提取器</text>
  <text x="630" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">Feature Extractor</text>
  
  <!-- Model Inference -->
  <rect x="800" y="80" width="160" height="60" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="880" y="115" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">模型推理</text>
  <text x="880" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">Model Inference</text>
  
  <!-- Result Storage -->
  <rect x="550" y="220" width="160" height="60" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="630" y="255" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">结果存储</text>
  <text x="630" y="270" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">Result Storage</text>
  
  <!-- Alert Engine -->
  <rect x="300" y="220" width="160" height="60" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="380" y="255" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">告警引擎</text>
  <text x="380" y="270" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">Alert Engine</text>
  
  <!-- WebSocket Manager -->
  <rect x="50" y="220" width="160" height="60" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="130" y="255" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">WebSocket管理</text>
  <text x="130" y="270" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">WebSocket Manager</text>
  
  <!-- Data Flow Arrows -->
  <!-- Traffic Capture to Redis -->
  <path d="M 210 110 L 300 110" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="255" y="105" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">网络数据包</text>
  
  <!-- Redis to Feature Extractor -->
  <path d="M 460 110 L 550 110" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="505" y="105" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">批量数据</text>
  
  <!-- Feature Extractor to Model Inference -->
  <path d="M 710 110 L 800 110" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="755" y="105" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">特征向量</text>
  
  <!-- Model Inference to Result Storage -->
  <path d="M 880 140 L 880 180 L 710 180 L 710 220" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="795" y="175" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">检测结果</text>
  
  <!-- Result Storage to Alert Engine -->
  <path d="M 550 250 L 460 250" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="505" y="245" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">告警数据</text>
  
  <!-- Alert Engine to WebSocket -->
  <path d="M 300 250 L 210 250" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="255" y="245" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">实时推送</text>
  
  <!-- External API Flow -->
  <rect x="800" y="220" width="160" height="60" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="880" y="255" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">外部API接口</text>
  <text x="880" y="270" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">External API</text>
  
  <!-- Result to API -->
  <path d="M 710 250 L 800 250" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="755" y="245" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">REST API</text>
  
  <!-- Data Types Legend -->
  <rect x="50" y="350" width="900" height="200" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="500" y="380" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#000000">数据类型说明</text>
  
  <!-- Raw Network Data -->
  <rect x="70" y="400" width="20" height="15" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="100" y="412" font-family="Arial" font-size="12" fill="#000000">原始网络数据包 (Raw Network Packets)</text>
  
  <!-- Processed Features -->
  <rect x="70" y="430" width="20" height="15" fill="#000000" stroke="#000000" stroke-width="1"/>
  <text x="100" y="442" font-family="Arial" font-size="12" fill="#000000">处理后特征 (Processed Features)</text>
  
  <!-- Model Predictions -->
  <circle cx="80" cy="465" r="10" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="100" y="470" font-family="Arial" font-size="12" fill="#000000">模型预测结果 (Model Predictions)</text>
  
  <!-- Alerts -->
  <polygon points="70,485 85,485 90,500 75,515 60,500 65,485" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="100" y="505" font-family="Arial" font-size="12" fill="#000000">告警信息 (Alert Notifications)</text>
  
  <!-- Process Flow -->
  <path d="M 400 400 L 450 400" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="425" y="395" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">处理流程 (Processing Flow)</text>
  
  <!-- Real-time Flow -->
  <path d="M 400 430 L 450 430" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="425" y="425" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">实时流 (Real-time Stream)</text>
  
  <!-- Define arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- Processing Steps Description -->
  <text x="500" y="550" text-anchor="middle" font-family="Arial" font-size="14" fill="#000000">
    数据流处理步骤：流量捕获 → Redis队列 → 特征提取 → 模型推理 → 结果存储 → 告警推送 → WebSocket实时通知
  </text>
  <text x="500" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#000000">
    Data Flow Steps: Traffic Capture → Redis Queue → Feature Extraction → Model Inference → Result Storage → Alert Push → WebSocket Real-time Notification
  </text>
</svg>