services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: nids-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nids_db
      MYSQL_USER: nids
      MYSQL_PASSWORD: nids_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - nids-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nids-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nids-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nids-backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: nids
      MYSQL_PASSWORD: nids_password
      MYSQL_DATABASE: nids_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nids-network
    # Privileged mode for network capture
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nids-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nids-network

volumes:
  mysql_data:
  redis_data:

networks:
  nids-network:
    driver: bridge
