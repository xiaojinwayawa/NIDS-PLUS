<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', SimSun, serif; font-size: 28px; font-weight: bold; fill: #000; }
      .label { font-family: 'Times New Roman', SimSun, serif; font-size: 18px; font-weight: bold; fill: #000; }
      .text { font-family: 'Times New Roman', SimSun, serif; font-size: 15px; fill: #000; }
      .small { font-family: 'Times New Roman', SimSun, serif; font-size: 13px; fill: #000; }
      .host { fill: #fff; stroke: #000; stroke-width: 2.2; }
      .group { fill: #fff; stroke: #000; stroke-width: 1.8; stroke-dasharray: 8 5; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.8; }
      .volume { fill: #fff; stroke: #000; stroke-width: 1.6; }
      .line { stroke: #000; stroke-width: 1.8; fill: none; }
      .dashed { stroke: #000; stroke-width: 1.6; fill: none; stroke-dasharray: 7 5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#fff"/>

  <rect x="80" y="80" width="1240" height="760" rx="8" class="host"/>

  <rect x="150" y="150" width="1100" height="560" rx="8" class="group"/>

  <rect x="220" y="240" width="220" height="170" rx="8" class="box"/>
  <text x="330" y="272" text-anchor="middle" class="label">MySQL 容器</text>
  <text x="330" y="300" text-anchor="middle" class="text">镜像：mysql:8.0</text>
  <text x="330" y="326" text-anchor="middle" class="text">容器名：nids-mysql</text>
  <text x="330" y="352" text-anchor="middle" class="text">端口：3306:3306</text>
  <text x="330" y="378" text-anchor="middle" class="text">数据库：nids_db</text>

  <rect x="500" y="240" width="220" height="170" rx="8" class="box"/>
  <text x="610" y="272" text-anchor="middle" class="label">Redis 容器</text>
  <text x="610" y="300" text-anchor="middle" class="text">镜像：redis:7-alpine</text>
  <text x="610" y="326" text-anchor="middle" class="text">容器名：nids-redis</text>
  <text x="610" y="352" text-anchor="middle" class="text">端口：6379:6379</text>
  <text x="610" y="378" text-anchor="middle" class="text">用途：缓存 / 消息队列</text>

  <rect x="780" y="220" width="240" height="210" rx="8" class="box"/>
  <text x="900" y="252" text-anchor="middle" class="label">后端容器</text>
  <text x="900" y="280" text-anchor="middle" class="text">FastAPI + 检测引擎</text>
  <text x="900" y="306" text-anchor="middle" class="text">容器名：nids-backend</text>
  <text x="900" y="332" text-anchor="middle" class="text">端口：8000:8000</text>
  <text x="900" y="358" text-anchor="middle" class="text">依赖：MySQL、Redis</text>
  <text x="900" y="384" text-anchor="middle" class="text">特权：NET_ADMIN / NET_RAW</text>
  <text x="900" y="410" text-anchor="middle" class="small">挂载：backend、data、models</text>

  <rect x="1080" y="240" width="220" height="170" rx="8" class="box"/>
  <text x="1190" y="272" text-anchor="middle" class="label">前端容器</text>
  <text x="1190" y="300" text-anchor="middle" class="text">Vue 3 + Nginx</text>
  <text x="1190" y="326" text-anchor="middle" class="text">容器名：nids-frontend</text>
  <text x="1190" y="352" text-anchor="middle" class="text">端口：80:80</text>
  <text x="1190" y="378" text-anchor="middle" class="text">依赖：backend</text>

  <path d="M 440 300 L 460 300 L 460 210 L 780 210" class="line" marker-end="url(#arrow)"/>
  <line x1="720" y1="325" x2="780" y2="325" class="line" marker-end="url(#arrow)"/>
  <line x1="1020" y1="325" x2="1080" y2="325" class="line" marker-end="url(#arrow)"/>
  <text x="620" y="194" text-anchor="middle" class="small">数据库连接</text>
  <text x="748" y="312" text-anchor="middle" class="small">缓存/队列</text>
  <text x="1050" y="312" text-anchor="middle" class="small">HTTP API</text>

  <rect x="230" y="510" width="200" height="78" rx="6" class="volume"/>
  <text x="330" y="540" text-anchor="middle" class="label">mysql_data</text>
  <text x="330" y="564" text-anchor="middle" class="text">数据库持久化卷</text>

  <rect x="510" y="510" width="200" height="78" rx="6" class="volume"/>
  <text x="610" y="540" text-anchor="middle" class="label">redis_data</text>
  <text x="610" y="564" text-anchor="middle" class="text">Redis 持久化卷</text>

  <rect x="790" y="500" width="220" height="98" rx="6" class="volume"/>
  <text x="900" y="530" text-anchor="middle" class="label">宿主机目录挂载</text>
  <text x="900" y="554" text-anchor="middle" class="text">./backend → /app</text>
  <text x="900" y="576" text-anchor="middle" class="text">./data → /app/data</text>

  <rect x="1045" y="500" width="220" height="98" rx="6" class="volume"/>
  <text x="1155" y="530" text-anchor="middle" class="label">模型目录挂载</text>
  <text x="1155" y="554" text-anchor="middle" class="text">./models → /app/models</text>
  <text x="1155" y="576" text-anchor="middle" class="text">前端静态资源由 Nginx 提供</text>

  <line x1="330" y1="410" x2="330" y2="510" class="dashed" marker-end="url(#arrow)"/>
  <line x1="610" y1="410" x2="610" y2="510" class="dashed" marker-end="url(#arrow)"/>
  <line x1="900" y1="430" x2="900" y2="500" class="dashed" marker-end="url(#arrow)"/>
  <line x1="1155" y1="410" x2="1155" y2="500" class="dashed" marker-end="url(#arrow)"/>

  <rect x="290" y="740" width="820" height="55" rx="6" class="box"/>
  <text x="700" y="774" text-anchor="middle" class="text">浏览器用户通过前端容器访问系统，前端调用后端 API，后端依赖 MySQL 和 Redis 完成业务处理与数据持久化。</text>
</svg>
