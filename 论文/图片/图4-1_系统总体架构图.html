<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图4-1 系统总体架构图</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 28px;
            background:
                radial-gradient(circle at top left, #f0f0f0 0, transparent 26%),
                radial-gradient(circle at top right, #fafafa 0, transparent 24%),
                linear-gradient(180deg, #f5f5f5 0%, #ebebeb 100%);
            font-family: "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif;
            color: #111827;
        }

        .page {
            width: 1520px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #d9d9d9;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.10);
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 34px 18px;
            background: linear-gradient(135deg, #f7f7f7 0%, #efefef 100%);
            border-bottom: 1px solid #e5e7eb;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .badge {
            min-width: 92px;
            padding: 10px 16px;
            border-radius: 0;
            background: linear-gradient(135deg, #4b5563 0%, #111827 100%);
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 32px;
            line-height: 1.2;
            color: #111827;
        }

        .tag {
            padding: 10px 16px;
            border-radius: 0;
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #374151;
            font-size: 15px;
            font-weight: 600;
        }

        .canvas {
            padding: 28px 30px 20px;
        }

        .figure-shell {
            padding: 22px;
            background: linear-gradient(180deg, #fbfbfb 0%, #f5f5f5 100%);
            border: 1px solid #e5e7eb;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        @media print {
            body {
                padding: 0;
                background: #ffffff;
            }

            .page {
                width: 100%;
                border: none;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div class="title-wrap">
                <div class="badge">图 4-1</div>
                <div>
                    <h1>系统总体架构图</h1>
                </div>
            </div>
            <div class="tag">前后端分离架构 · 分层设计</div>
        </div>

        <div class="canvas">
            <div class="figure-shell">
                <svg viewBox="0 0 1460 1120" xmlns="http://www.w3.org/2000/svg" aria-label="系统总体架构图">
                    <defs>
                        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#9ca3af" flood-opacity="0.18"/>
                        </filter>
                        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
                            <path d="M1,1 L10,6 L1,11 z" fill="#111827"/>
                        </marker>
                    </defs>

                    <rect x="20" y="20" width="1420" height="1080" fill="#ffffff"/>
                    <text x="730" y="66" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">系统总体采用前后端分离与分层设计架构</text>

                    <rect x="110" y="130" width="1240" height="170" fill="#ffffff" stroke="#000000" stroke-width="2.2" filter="url(#shadow)"/>
                    <text x="155" y="162" font-size="21" font-weight="700" fill="#000000">表示层</text>

                    <rect x="190" y="190" width="220" height="74" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="300" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">用户浏览器</text>

                    <line x1="410" y1="227" x2="510" y2="227" stroke="#111827" stroke-width="3.2" marker-end="url(#arrow)"/>

                    <rect x="520" y="175" width="390" height="95" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
                    <text x="715" y="232" text-anchor="middle" font-size="21" font-weight="700" fill="#000000">Vue3 前端界面</text>

                    <line x1="910" y1="227" x2="1048" y2="227" stroke="#111827" stroke-width="3.2" marker-end="url(#arrow)"/>

                    <rect x="1060" y="175" width="220" height="95" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
                    <text x="1170" y="232" text-anchor="middle" font-size="21" font-weight="700" fill="#000000">Nginx / 前端容器</text>

                    <rect x="110" y="330" width="1240" height="260" fill="#ffffff" stroke="#000000" stroke-width="2.2" filter="url(#shadow)"/>
                    <text x="155" y="362" font-size="21" font-weight="700" fill="#000000">业务服务层</text>

                    <rect x="175" y="400" width="340" height="82" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="345" y="445" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">认证与系统控制服务</text>

                    <rect x="560" y="400" width="340" height="82" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="730" y="445" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">监控与告警服务</text>

                    <rect x="945" y="400" width="340" height="82" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="1115" y="445" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">训练与评估服务</text>

                    <rect x="280" y="515" width="360" height="82" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="460" y="560" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">FastAPI 应用入口</text>

                    <rect x="820" y="515" width="360" height="82" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="1000" y="560" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">Copilot 与辅助接口</text>

                    <line x1="715" y1="270" x2="715" y2="330" stroke="#111827" stroke-width="3.2" marker-end="url(#arrow)"/>

                    <rect x="110" y="620" width="1240" height="240" fill="#ffffff" stroke="#000000" stroke-width="2.2" filter="url(#shadow)"/>
                    <text x="155" y="652" font-size="21" font-weight="700" fill="#000000">算法引擎层</text>

                    <rect x="150" y="695" width="250" height="92" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="275" y="742" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">流量采集与聚合</text>

                    <rect x="440" y="695" width="250" height="92" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="565" y="742" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">特征提取引擎</text>

                    <rect x="730" y="695" width="250" height="92" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="855" y="742" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">检测与推理引擎</text>

                    <rect x="1020" y="695" width="290" height="92" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="1165" y="742" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">训练与实验引擎</text>

                    <rect x="515" y="806" width="430" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
                    <text x="730" y="832" text-anchor="middle" font-size="16" font-weight="700" fill="#000000">加权融合策略：综合 LightGBM 与 1D-CNN 输出结果</text>

                    <line x1="400" y1="741" x2="440" y2="741" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
                    <line x1="690" y1="741" x2="730" y2="741" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
                    <line x1="980" y1="741" x2="1020" y2="741" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
                    <line x1="855" y1="787" x2="855" y2="806" stroke="#111827" stroke-width="2.6" marker-end="url(#arrow)"/>
                    <line x1="1165" y1="787" x2="945" y2="826" stroke="#111827" stroke-width="2.6" marker-end="url(#arrow)"/>

                    <line x1="730" y1="590" x2="730" y2="620" stroke="#111827" stroke-width="3.2" marker-end="url(#arrow)"/>
                    <rect x="748" y="598" width="88" height="24" fill="#ffffff" stroke="#d1d5db"/>
                    <text x="792" y="615" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">服务调用</text>

                    <rect x="110" y="890" width="1240" height="170" fill="#ffffff" stroke="#000000" stroke-width="2.2" filter="url(#shadow)"/>
                    <text x="155" y="922" font-size="21" font-weight="700" fill="#000000">数据与基础设施层</text>

                    <rect x="150" y="955" width="180" height="72" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="240" y="997" text-anchor="middle" font-size="19" font-weight="700" fill="#000000">MySQL</text>

                    <rect x="365" y="955" width="180" height="72" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="455" y="997" text-anchor="middle" font-size="19" font-weight="700" fill="#000000">Redis</text>

                    <rect x="580" y="955" width="210" height="72" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="685" y="997" text-anchor="middle" font-size="19" font-weight="700" fill="#000000">模型文件仓库</text>

                    <rect x="825" y="955" width="210" height="72" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="930" y="997" text-anchor="middle" font-size="19" font-weight="700" fill="#000000">数据文件存储</text>

                    <rect x="1070" y="955" width="240" height="72" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="1190" y="997" text-anchor="middle" font-size="19" font-weight="700" fill="#000000">Docker 运行环境</text>

                    <line x1="275" y1="787" x2="240" y2="955" stroke="#111827" stroke-width="2.8" marker-end="url(#arrow)"/>
                    <line x1="565" y1="787" x2="685" y2="955" stroke="#111827" stroke-width="2.8" marker-end="url(#arrow)"/>
                    <line x1="855" y1="787" x2="455" y2="955" stroke="#111827" stroke-width="2.8" marker-end="url(#arrow)"/>
                    <line x1="855" y1="787" x2="930" y2="955" stroke="#111827" stroke-width="2.8" marker-end="url(#arrow)"/>
                    <line x1="1165" y1="787" x2="1190" y2="955" stroke="#111827" stroke-width="2.8" marker-end="url(#arrow)"/>

                    <rect x="30" y="410" width="62" height="110" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <text x="61" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">外部</text>
                    <text x="61" y="486" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">流量</text>
                    <text x="61" y="512" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">输入</text>

                    <line x1="92" y1="465" x2="150" y2="720" stroke="#111827" stroke-width="2.8" marker-end="url(#arrow)"/>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
