<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 650" width="1150" height="650">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', SimSun, serif; font-size: 26px; font-weight: bold; fill: #000; }
      .entity { fill: #fff; stroke: #000; stroke-width: 2; }
      .head { fill: #fff; stroke: #000; stroke-width: 2; }
      .entity-title { font-family: 'Times New Roman', SimSun, serif; font-size: 20px; font-weight: bold; fill: #000; }
      .field { font-family: Consolas, 'Courier New', monospace; font-size: 14px; fill: #000; }
      .line { stroke: #000; stroke-width: 1.8; fill: none; }
      .label { font-family: 'Times New Roman', SimSun, serif; font-size: 14px; fill: #000; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1150" height="650" fill="#fff"/>
  <text x="575" y="42" text-anchor="middle" class="title">ER分图：模型、告警与指标关系</text>

  <g transform="translate(90,90)">
    <rect width="320" height="245" class="entity"/>
    <rect width="320" height="38" class="head"/>
    <text x="160" y="24" text-anchor="middle" class="entity-title">models</text>
    <text x="14" y="66" class="field">PK  id</text>
    <text x="14" y="92" class="field">name</text>
    <text x="14" y="118" class="field">type</text>
    <text x="14" y="144" class="field">version</text>
    <text x="14" y="170" class="field">file_path</text>
    <text x="14" y="196" class="field">dataset_type</text>
    <text x="14" y="222" class="field">is_active, trained_at</text>
  </g>

  <g transform="translate(740,95)">
    <rect width="300" height="220" class="entity"/>
    <rect width="300" height="38" class="head"/>
    <text x="150" y="24" text-anchor="middle" class="entity-title">model_metrics</text>
    <text x="14" y="66" class="field">PK  id</text>
    <text x="14" y="92" class="field">FK  model_id</text>
    <text x="14" y="118" class="field">accuracy</text>
    <text x="14" y="144" class="field">precision_score</text>
    <text x="14" y="170" class="field">recall, f1_score</text>
    <text x="14" y="196" class="field">timestamp, inference_time_ms</text>
  </g>

  <g transform="translate(380,395)">
    <rect width="410" height="210" class="entity"/>
    <rect width="410" height="38" class="head"/>
    <text x="205" y="24" text-anchor="middle" class="entity-title">alerts</text>
    <text x="14" y="66" class="field">PK  id</text>
    <text x="14" y="92" class="field">timestamp</text>
    <text x="14" y="118" class="field">attack_type, confidence</text>
    <text x="14" y="144" class="field">FK  model_id</text>
    <text x="14" y="170" class="field">marked_by, raw_features</text>
  </g>

  <line x1="410" y1="205" x2="740" y2="205" class="line" marker-end="url(#arrow)"/>
  <text x="575" y="190" text-anchor="middle" class="label">models.id → model_metrics.model_id</text>
  <text x="575" y="212" text-anchor="middle" class="label">1 : N</text>

  <line x1="505" y1="335" x2="555" y2="395" class="line" marker-end="url(#arrow)"/>
  <text x="460" y="370" class="label">1 : N</text>
  <text x="430" y="392" class="label">models.id → alerts.model_id</text>
</svg>
